<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>258 Tangerine Dr, Buda, TX — Neighborhood Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
  :root{
    --ink: #202B3B;
    --ink-soft: #4C5A6E;
    --cream: #F6F1E7;
    --panel: #FFFFFF;
    --line: #E4DCC9;
    --gold: #C08A2E;
    --gold-deep: #96691E;
    --gold-soft: rgba(192,138,46,0.16);
    --shadow: 0 6px 24px rgba(32,43,59,0.12);

    --c-schools: #3A5A78;
    --c-hospitals: #A13D2B;
    --c-grocery: #4F7A52;
    --c-transit: #6B4E8E;
    --c-parks: #2F6B3F;
    --c-banks: #8C6D1F;
    --c-restaurants: #B5502F;
    --c-pharmacies: #2B7A78;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background: var(--cream);
    overflow: hidden;
  }
  .mono{ font-family: 'IBM Plex Mono', monospace; }

  /* ---------- Layout shell ---------- */
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 20px;
    padding: 14px 22px;
    background: var(--ink);
    color: #F6F1E7;
    z-index: 1000;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    min-width:0;
  }
  .brand .sun{
    width:16px;height:16px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #FFE9B8, var(--gold) 60%, var(--gold-deep));
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-size: 17px;
    font-weight:600;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand .sub{
    font-size:12px;
    color:#B9C2CE;
    white-space:nowrap;
  }
  .specs{
    display:flex;
    gap:18px;
    align-items:center;
    flex-shrink:0;
  }
  .specs .price{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:600;
    color:#F2CD7E;
  }
  .specs .stat{
    font-size:12.5px;
    color:#D8DEE6;
    text-align:center;
    line-height:1.25;
  }
  .specs .stat b{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:#fff;
  }
  #menuBtn{
    display:none;
    background: var(--gold);
    color:#fff;
    border:none;
    border-radius:8px;
    width:38px;height:38px;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ---------- Body split ---------- */
  #body{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width: 300px;
    flex-shrink:0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y:auto;
    padding: 18px 16px 90px;
  }
  #sidebar h2{
    font-family:'Fraunces', serif;
    font-size:14px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--ink-soft);
    margin: 18px 0 10px;
  }
  #sidebar h2:first-child{ margin-top:0; }

  .layer-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 6px;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
    transition: background .15s;
  }
  .layer-row:hover{ background: var(--cream); }
  .layer-row.disabled{ opacity:.45; cursor:default; }
  .layer-row.disabled:hover{ background:none; }

  .dot{
    width:13px;height:13px;border-radius:50%;
    flex-shrink:0;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55);
  }
  .layer-row .label{
    flex:1;
    font-size:13.5px;
    font-weight:500;
  }
  .layer-row .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color: var(--ink-soft);
    background: var(--cream);
    border-radius:6px;
    padding:2px 7px;
  }
  .switch{
    position:relative;
    width:34px;height:19px;
    background:#DDD6C7;
    border-radius:999px;
    flex-shrink:0;
    transition: background .15s;
  }
  .switch::after{
    content:'';
    position:absolute;
    top:2px;left:2px;
    width:15px;height:15px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
    transition: left .15s;
  }
  .layer-row.on .switch{ background: var(--gold); }
  .layer-row.on .switch::after{ left:17px; }

  .radius-note{
    font-size:12px;
    color: var(--ink-soft);
    line-height:1.5;
    padding: 10px 6px 4px;
    border-top:1px dashed var(--line);
    margin-top:10px;
  }
  .radius-note b{ color: var(--ink); }

  .legend-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .legend-actions button{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:8px 6px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--cream);
    color:var(--ink);
    cursor:pointer;
  }
  .legend-actions button:hover{ border-color: var(--gold); color: var(--gold-deep); }

  /* ---------- Map ---------- */
  #map{ flex:1; background:#E9E3D5; }

  .leaflet-popup-content-wrapper{
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .leaflet-popup-content{ margin: 14px 16px; }
  .leaflet-popup-tip{ box-shadow:none; }

  .poi-pop .cat-tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:2px 8px;
    border-radius:999px;
    color:#fff;
    margin-bottom:6px;
  }
  .poi-pop .name{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 3px;
    color: var(--ink);
  }
  .poi-pop .addr{
    font-size:12px;
    color: var(--ink-soft);
    margin:0 0 10px;
    line-height:1.4;
  }
  .poi-pop .stats{
    display:flex;
    gap:8px;
  }
  .poi-pop .stat-box{
    flex:1;
    background: var(--cream);
    border-radius:8px;
    padding:6px 8px;
    text-align:center;
  }
  .poi-pop .stat-box .k{
    font-size:10px;
    color: var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .poi-pop .stat-box .v{
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    font-weight:600;
    color: var(--ink);
  }

  .home-pop .eyebrow{
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color: var(--gold-deep);
    margin-bottom:4px;
  }
  .home-pop .name{
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:700;
    margin:0 0 2px;
  }
  .home-pop .addr2{ font-size:12px; color:var(--ink-soft); margin:0 0 10px; }
  .home-pop .price{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:700;
    color: var(--gold-deep);
    margin-bottom:8px;
  }
  .home-pop .specs2{
    display:flex; gap:14px;
    font-size:12.5px;
    color: var(--ink);
  }
  .home-pop .specs2 b{ font-family:'IBM Plex Mono', monospace; }

  /* custom divIcon markers */
  .poi-marker{
    width:26px;height:26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 2px 6px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.55);
  }
  .poi-marker svg{ width:14px;height:14px; }

  .home-marker{ position:relative; width:34px; height:34px; }
  .home-marker .ring{
    position:absolute; inset:0;
    border-radius:50%;
    background: var(--gold);
    opacity:.35;
    animation: pulse 2.2s ease-out infinite;
  }
  .home-marker .core{
    position:absolute; top:7px; left:7px; width:20px; height:20px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #FFE9B8, var(--gold) 55%, var(--gold-deep));
    box-shadow: 0 2px 8px rgba(150,105,30,.6), inset 0 0 0 2px rgba(255,255,255,.6);
  }
  @keyframes pulse{
    0%{ transform: scale(.5); opacity:.55; }
    100%{ transform: scale(2.1); opacity:0; }
  }

  .leaflet-control-scale-line{
    background: rgba(255,255,255,.9);
    border-color: var(--ink-soft);
    color: var(--ink);
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 860px){
    #menuBtn{ display:block; }
    .specs{ display:none; }
    #sidebar{
      position:absolute;
      top:60px; bottom:0; left:0;
      width: 84%;
      max-width:320px;
      transform: translateX(-105%);
      transition: transform .22s ease;
      z-index: 900;
      box-shadow: var(--shadow);
    }
    #sidebar.open{ transform: translateX(0); }
    #scrim{
      position:absolute; inset:60px 0 0 0;
      background: rgba(32,43,59,0.35);
      z-index: 850;
      display:none;
    }
    #scrim.show{ display:block; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <span class="sun"></span>
      <div>
        <h1>258 Tangerine Dr</h1>
        <div class="sub">Buda, TX 78610 · Sunfield Ph Two Sec Four</div>
      </div>
    </div>
    <div class="specs">
      <div class="price mono">$709,000</div>
      <div class="stat">Beds<b>5</b></div>
      <div class="stat">Baths<b>4</b></div>
      <div class="stat">Sq Ft<b>4,052</b></div>
    </div>
    <button id="menuBtn" aria-label="Toggle legend">☰</button>
  </header>

  <div id="body">
    <div id="scrim"></div>
    <aside id="sidebar">
      <h2>What's nearby</h2>
      <div id="layerList"></div>

      <div class="radius-note">
        Dashed circle marks a <b>1.86‑mile</b> radius from the property. Distances in each pin are real driving and walking routes, not straight lines.
      </div>

      <div class="legend-actions">
        <button id="showAll">Show all</button>
        <button id="hideAll">Hide all</button>
      </div>
    </aside>

    <div id="map"></div>
  </div>
</div>

<script>
const PROPERTY = {
  address: "258 Tangerine Dr, Buda, TX 78610",
  lat: 30.0815899,
  lon: -97.8099067,
  radius_m: 3000
};

const CATEGORY_META = {
  schools:     { color: "var(--c-schools)",     hex:"#3A5A78", icon: "cap" },
  hospitals:   { color: "var(--c-hospitals)",   hex:"#A13D2B", icon: "cross" },
  grocery:     { color: "var(--c-grocery)",     hex:"#4F7A52", icon: "basket" },
  transit:     { color: "var(--c-transit)",     hex:"#6B4E8E", icon: "bus" },
  parks:       { color: "var(--c-parks)",       hex:"#2F6B3F", icon: "tree" },
  banks:       { color: "var(--c-banks)",       hex:"#8C6D1F", icon: "bank" },
  restaurants: { color: "var(--c-restaurants)", hex:"#B5502F", icon: "fork" },
  pharmacies:  { color: "var(--c-pharmacies)",  hex:"#2B7A78", icon: "rx" }
};

const ICONS = {
  cap:    '<path d="M7 2 1 5l6 3 6-3-6-3Z" fill="#fff"/><path d="M3.3 6.3v3.1c0 .5 1.6 1.4 3.7 1.4s3.7-.9 3.7-1.4V6.3L7 8 3.3 6.3Z" fill="#fff"/>',
  cross:  '<path d="M6 1h2v4h4v2H8v4H6V7H2V5h4V1Z" fill="#fff"/>',
  basket: '<path d="M2 5h10l-1 6.5a1 1 0 0 1-1 .8H4a1 1 0 0 1-1-.8L2 5Z" fill="#fff"/><path d="M4.5 5 6 1.5M9.5 5 8 1.5" stroke="#fff" stroke-width="1.1" fill="none"/>',
  bus:    '<rect x="1.5" y="2.5" width="11" height="7" rx="1.4" fill="#fff"/><circle cx="4" cy="11" r="1.1" fill="#fff"/><circle cx="10" cy="11" r="1.1" fill="#fff"/>',
  tree:   '<circle cx="7" cy="5" r="4" fill="#fff"/><rect x="6.1" y="8" width="1.8" height="4.5" fill="#fff"/>',
  bank:   '<path d="M7 1 13 4.5H1L7 1Z" fill="#fff"/><rect x="1" y="5.5" width="12" height="1.6" fill="#fff"/><rect x="2.2" y="7.5" width="1.6" height="4" fill="#fff"/><rect x="6.2" y="7.5" width="1.6" height="4" fill="#fff"/><rect x="10.2" y="7.5" width="1.6" height="4" fill="#fff"/><rect x="1" y="11.7" width="12" height="1.4" fill="#fff"/>',
  fork:   '<rect x="6.2" y="1" width="1.4" height="12" fill="#fff"/><path d="M2.5 1v4.2c0 1 .8 1.8 1.8 1.8s1.8-.8 1.8-1.8V1M3.4 1v4.2M2.5 1v4.2" stroke="#fff" stroke-width="0.9" fill="none"/><path d="M10.5 1c-1.3 0-2.2 1.4-2.2 3.1 0 1.5.9 2.6 2 2.9V13" stroke="#fff" stroke-width="1.1" fill="none"/>',
  rx:     '<rect x="2" y="6.2" width="10" height="3.6" rx="1.8" fill="#fff" transform="rotate(-45 7 8)"/><rect x="4.4" y="7.4" width="5.2" height="1.2" fill="#2B7A78" transform="rotate(-45 7 8)"/>'
};

function poiMarker(catKey){
  const meta = CATEGORY_META[catKey];
  const html = `<div class="poi-marker" style="background:${meta.hex}"><svg viewBox="0 0 14 14">${ICONS[meta.icon]}</svg></div>`;
  return L.divIcon({ html, className:"", iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-14] });
}

const homeIcon = L.divIcon({
  html: '<div class="home-marker"><div class="ring"></div><div class="core"></div></div>',
  className: "",
  iconSize:[34,34],
  iconAnchor:[17,17],
  popupAnchor:[0,-18]
});

function fmt(n){ return (Math.round(n*10)/10).toString(); }

function buildPopup(catKey, meta, poi){
  return `
    <div class="poi-pop">
      <span class="cat-tag" style="background:${meta.hex}">${catKey}</span>
      <p class="name">${poi.name}</p>
      <p class="addr">${poi.address || ""}</p>
      <div class="stats">
        <div class="stat-box">
          <div class="k">Driving</div>
          <div class="v">${fmt(poi.driving.miles)} mi · ${fmt(poi.driving.minutes)} min</div>
        </div>
        <div class="stat-box">
          <div class="k">Walking</div>
          <div class="v">${fmt(poi.walking.miles)} mi · ${fmt(poi.walking.minutes)} min</div>
        </div>
      </div>
    </div>`;
}

const map = L.map('map', { zoomControl:false, attributionControl:true }).setView([PROPERTY.lat, PROPERTY.lon], 14);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

L.control.zoom({ position:'bottomright' }).addTo(map);
L.control.scale({ position:'bottomleft', imperial:true, metric:false }).addTo(map);

L.circle([PROPERTY.lat, PROPERTY.lon], {
  radius: PROPERTY.radius_m,
  color: '#C08A2E',
  weight: 2,
  dashArray: '6 8',
  fillColor: '#C08A2E',
  fillOpacity: 0.04
}).addTo(map);

const homeMarker = L.marker([PROPERTY.lat, PROPERTY.lon], { icon: homeIcon, zIndexOffset: 1000 }).addTo(map);
homeMarker.bindPopup(`
  <div class="home-pop">
    <div class="eyebrow">For Sale</div>
    <p class="name">258 Tangerine Dr</p>
    <p class="addr2">Buda, TX 78610 · Sunfield Ph Two Sec Four</p>
    <div class="price">$709,000</div>
    <div class="specs2"><span><b>5</b> bed</span><span><b>4</b> bath</span><span><b>4,052</b> sqft</span></div>
  </div>
`);

const layerGroups = {};
const sidebarState = {};

function renderSidebar(categories){
  const list = document.getElementById('layerList');
  list.innerHTML = '';
  Object.keys(CATEGORY_META).forEach(catKey => {
    const meta = CATEGORY_META[catKey];
    const catData = categories[catKey];
    const count = catData ? catData.pois.length : 0;
    const hasAny = count > 0;

    const row = document.createElement('div');
    row.className = 'layer-row' + (hasAny ? ' on' : ' disabled');
    row.innerHTML = `
      <span class="dot" style="background:${meta.hex}"></span>
      <span class="label">${catData ? catData.label : catKey}</span>
      <span class="count">${count}</span>
      <span class="switch"></span>
    `;
    if (hasAny){
      row.addEventListener('click', () => toggleLayer(catKey, row));
      sidebarState[catKey] = row;
    }
    list.appendChild(row);
  });
}

function toggleLayer(catKey, row){
  const group = layerGroups[catKey];
  if (!group) return;
  if (map.hasLayer(group)){
    map.removeLayer(group);
    row.classList.remove('on');
  } else {
    map.addLayer(group);
    row.classList.add('on');
  }
}

function loadData(data){
  const categories = data.categories;
  renderSidebar(categories);

  Object.keys(CATEGORY_META).forEach(catKey => {
    const meta = CATEGORY_META[catKey];
    const catData = categories[catKey];
    const group = L.layerGroup();
    if (catData && catData.pois.length){
      catData.pois.forEach(poi => {
        const marker = L.marker([poi.lat, poi.lon], { icon: poiMarker(catKey) });
        marker.bindPopup(buildPopup(catKey, meta, poi));
        group.addLayer(marker);
      });
      group.addTo(map);
    }
    layerGroups[catKey] = group;
  });

  document.getElementById('showAll').addEventListener('click', () => {
    Object.keys(sidebarState).forEach(catKey => {
      const row = sidebarState[catKey];
      const group = layerGroups[catKey];
      if (!map.hasLayer(group)){ map.addLayer(group); row.classList.add('on'); }
    });
  });
  document.getElementById('hideAll').addEventListener('click', () => {
    Object.keys(sidebarState).forEach(catKey => {
      const row = sidebarState[catKey];
      const group = layerGroups[catKey];
      if (map.hasLayer(group)){ map.removeLayer(group); row.classList.remove('on'); }
    });
  });
}

fetch('./data/pois.json')
  .then(r => { if(!r.ok) throw new Error('http'); return r.json(); })
  .then(loadData)
  .catch(() => {
    document.getElementById('layerList').innerHTML =
      '<p style="font-size:12.5px;color:var(--ink-soft);line-height:1.5;">Could not load <span class="mono">data/pois.json</span>. If you opened this file directly, run <span class="mono">npm run serve</span> (or any local server) instead — browsers block local file fetches.</p>';
  });

/* mobile drawer */
const sidebarEl = document.getElementById('sidebar');
const scrimEl = document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
  scrimEl.classList.toggle('show');
});
scrimEl.addEventListener('click', () => {
  sidebarEl.classList.remove('open');
  scrimEl.classList.remove('show');
});
</script>
</body>
</html>
